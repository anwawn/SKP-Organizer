<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Kegiatan Organizer by @anwawn</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --success-hover: #059669;
            --bg-gradient: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        
        body { 
            background: var(--bg-gradient); 
            min-height: 100vh; 
            padding: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            color: var(--text-main); 
        }
        
        .container { 
            width: 100%; 
            max-width: 550px; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 35px 25px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            backdrop-filter: blur(10px);
        }
        
        h1 { font-size: 1.4rem; text-align: center; color: var(--primary); margin-bottom: 25px; font-weight: 600; }
        
        .form-group { margin-bottom: 20px; }
        
        label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.95rem; color: var(--text-main); }
        
        input[type="date"], textarea { 
            width: 100%; padding: 12px 15px; border: 1.5px solid #d1d5db; 
            border-radius: 10px; font-size: 0.95rem; transition: all 0.3s ease; 
            background: #f9fafb;
        }
        
        input[type="date"]:focus, textarea:focus { 
            border-color: var(--primary); outline: none; background: white;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); 
        }
        
        input[type="file"] {
            width: 100%; padding: 15px; background: #f8fafc;
            border: 2px dashed #cbd5e1; border-radius: 12px; cursor: pointer; transition: 0.3s;
        }
        input[type="file"]:hover { border-color: var(--primary); }
        input[type="file"]::file-selector-button {
            background: var(--primary); color: white; border: none;
            padding: 8px 16px; border-radius: 8px; cursor: pointer;
            margin-right: 15px; font-weight: 500; font-family: 'Poppins', sans-serif; transition: 0.3s;
        }
        input[type="file"]::file-selector-button:hover { background: var(--primary-hover); }

        textarea { resize: vertical; height: 110px; }
        
        button { 
            width: 100%; padding: 14px; border: none; border-radius: 12px; 
            font-size: 1.05rem; font-weight: 600; cursor: pointer; margin-top: 15px; 
            transition: all 0.3s ease; display: flex; justify-content: center; align-items: center;
        }
        
        .btn-auth { background-color: var(--primary); color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .btn-auth:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        
        .btn-upload { background-color: var(--success); color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); display: none; }
        .btn-upload:hover { background-color: var(--success-hover); transform: translateY(-2px); }
        .btn-upload:disabled { background-color: #9ca3af; cursor: not-allowed; transform: none; box-shadow: none; }
        
        #status { margin-top: 20px; font-size: 0.9rem; text-align: center; color: var(--text-muted); font-weight: 500; }
        .loading:after { content: '...'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60%, 100% { content: '...'; } }
    </style>
</head>
<body>

<div class="container">
    <h1>Laporan Kegiatan Organizer<br><span style="font-size: 0.85rem; font-weight: 400; color: #6b7280;">by @anwawn</span></h1>
    
    <button id="btnAuth" class="btn-auth">
        <svg style="width: 20px; height: 20px; margin-right: 8px;" viewBox="0 0 24 24" fill="white"><path d="M21.35,11.1H12.18V13.83H18.69C18.36,17.64 15.19,19.27 12.19,19.27C8.36,19.27 5,16.25 5,12C5,7.9 8.2,4.73 12.2,4.73C15.29,4.73 17.1,6.7 17.1,6.7L19,4.72C19,4.72 16.56,2 12.1,2C6.42,2 2.03,6.8 2.03,12C2.03,17.05 6.16,22 12.25,22C17.6,22 21.5,18.33 21.5,12.91C21.5,11.76 21.35,11.1 21.35,11.1V11.1Z"/></svg>
        Login dengan Akun Google
    </button>

    <div id="appInterface" style="display: none; margin-top: 10px;">
        <div class="form-group">
            <label>Unggah Foto (Bisa lebih dari 1)</label>
            <input type="file" id="photos" multiple accept="image/*">
        </div>
        <div class="form-group">
            <label>Tanggal Alternatif (Pilih jika foto tanpa data Exif)</label>
            <input type="date" id="fallbackDate">
        </div>
        <div class="form-group">
            <label>Deskripsi Kegiatan</label>
            <textarea id="description" placeholder="Tuliskan detail deskripsi kegiatan di sini..."></textarea>
        </div>
        <button id="btnUpload" class="btn-upload">Susun & Unggah Laporan</button>
    </div>

    <div id="status"></div>
    <canvas id="canvas" style="display: none;"></canvas>
</div>

<script>
    const CLIENT_ID = '899048761775-dbutua2rjtdcaitocooenf4kr677dcnk.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';
    let tokenClient;
    
    let accessToken = localStorage.getItem('gdrive_token');
    let tokenExpiry = localStorage.getItem('gdrive_token_expiry');

    window.onload = function () {
        if (accessToken && tokenExpiry && Date.now() < parseInt(tokenExpiry)) {
            document.getElementById('btnAuth').style.display = 'none';
            document.getElementById('appInterface').style.display = 'block';
            document.getElementById('btnUpload').style.display = 'block';
            logStatus("Sesi aktif. Anda siap membuat laporan.");
        }

        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPES,
            callback: (tokenResponse) => {
                if (tokenResponse && tokenResponse.access_token) {
                    accessToken = tokenResponse.access_token;
                    let expiryTime = Date.now() + (tokenResponse.expires_in * 1000);
                    
                    localStorage.setItem('gdrive_token', accessToken);
                    localStorage.setItem('gdrive_token_expiry', expiryTime.toString());

                    document.getElementById('btnAuth').style.display = 'none';
                    document.getElementById('appInterface').style.display = 'block';
                    document.getElementById('btnUpload').style.display = 'block';
                    logStatus("Login berhasil. Sesi akan bertahan selama 1 jam.");
                }
            }
        });
    };

    document.getElementById('btnAuth').onclick = () => { tokenClient.requestAccessToken(); };

    function logStatus(msg, isLoading = false) {
        const statusEl = document.getElementById('status');
        statusEl.innerText = msg;
        if (isLoading) {
            statusEl.classList.add('loading');
        } else {
            statusEl.classList.remove('loading');
        }
    }

    function getPhotoDate(file) {
        return new Promise((resolve) => {
            EXIF.getData(file, function() {
                let dateStr = EXIF.getTag(this, "DateTimeOriginal");
                if (dateStr) {
                    let parts = dateStr.split(" ")[0].split(":");
                    resolve({ year: parts[0], month: parts[1], day: parts[2] });
                } else {
                    resolve(null);
                }
            });
        });
    }

    async function createReportImage(files, description, dateData) {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const A4_WIDTH = 1240; const A4_HEIGHT = 1754;
        const MARGIN = 40; // Margin 40px di semua sisi
        
        canvas.width = A4_WIDTH; canvas.height = A4_HEIGHT;

        const CONTENT_WIDTH = A4_WIDTH - (MARGIN * 2);
        const CONTENT_HEIGHT = A4_HEIGHT - (MARGIN * 2);
        const photoAreaHeight = Math.floor(CONTENT_HEIGHT * 0.8);
        const textAreaHeight = CONTENT_HEIGHT - photoAreaHeight;

        // Latar belakang utama (putih murni)
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, A4_WIDTH, A4_HEIGHT);

        let images = [];
        for (let file of files) {
            let img = await new Promise((resolve) => {
                let reader = new FileReader();
                reader.onload = (e) => {
                    let image = new Image();
                    image.onload = () => resolve(image);
                    image.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
            images.push(img);
        }

        let cols = Math.ceil(Math.sqrt(images.length));
        let rows = Math.ceil(images.length / cols);
        let cellW = CONTENT_WIDTH / cols;
        let cellH = photoAreaHeight / rows;

        images.forEach((img, i) => {
            let col = i % cols; let row = Math.floor(i / cols);
            let cellX = MARGIN + (col * cellW) + 10;
            let cellY = MARGIN + (row * cellH) + 10;
            let targetW = cellW - 20;
            let targetH = cellH - 20;

            let ratio = Math.min(targetW / img.width, targetH / img.height);
            let newW = img.width * ratio;
            let newH = img.height * ratio;
            
            let drawX = cellX + (targetW - newW) / 2;
            let drawY = cellY + (targetH - newH) / 2;

            ctx.drawImage(img, drawX, drawY, newW, newH);
        });

        // Area teks dengan latar belakang abu-abu muda di dalam margin
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(MARGIN, MARGIN + photoAreaHeight, CONTENT_WIDTH, textAreaHeight);
        
        // Format Tanggal
        const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        let d = new Date(parseInt(dateData.year), parseInt(dateData.month) - 1, parseInt(dateData.day));
        let dateString = `${days[d.getDay()]}, ${dateData.day} ${months[d.getMonth()]} ${dateData.year}`;

        let textY = MARGIN + photoAreaHeight + 60;
        
        // Render Tanggal (Cetak Tebal)
        ctx.fillStyle = '#1e293b';
        ctx.font = 'bold 34px "Poppins", "Segoe UI", sans-serif';
        ctx.fillText(dateString, MARGIN + 40, textY);
        
        // Render Teks Deskripsi
        textY += 60; // Jarak antara tanggal dan deskripsi
        ctx.font = '32px "Poppins", "Segoe UI", sans-serif';
        
        let words = description.split(' ');
        let line = ''; 
        const maxWidth = CONTENT_WIDTH - 80;
        const lineHeight = 48;

        for(let n = 0; n < words.length; n++) {
            let testLine = line + words[n] + ' ';
            let metrics = ctx.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
                ctx.fillText(line, MARGIN + 40, textY);
                line = words[n] + ' '; textY += lineHeight;
            } else {
                line = testLine;
            }
        }
        ctx.fillText(line, MARGIN + 40, textY);

        return new Promise(resolve => {
            canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.85);
        });
    }

    async function fetchDrive(url, options = {}) {
        options.headers = { ...options.headers, 'Authorization': `Bearer ${accessToken}` };
        let res = await fetch(url, options);
        if (res.status === 401) {
            localStorage.removeItem('gdrive_token');
            localStorage.removeItem('gdrive_token_expiry');
            throw new Error("Sesi login telah berakhir. Silakan muat ulang halaman dan login kembali.");
        }
        return res.json();
    }

    async function getOrCreateFolder(folderName, parentId = 'root') {
        let q = `name='${folderName}' and mimeType='application/vnd.google-apps.folder' and '${parentId}' in parents and trashed=false`;
        let res = await fetchDrive(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id)`);
        
        if (res.files && res.files.length > 0) return res.files[0].id;

        let createRes = await fetchDrive('https://www.googleapis.com/drive/v3/files', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: folderName, mimeType: 'application/vnd.google-apps.folder', parents: [parentId] })
        });
        return createRes.id;
    }

    async function uploadToDrive(blob, filename, folderId) {
        let metadata = { name: filename, parents: [folderId] };
        let formData = new FormData();
        formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
        formData.append('file', blob);

        let res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${accessToken}` },
            body: formData
        });
        return res.json();
    }

    document.getElementById('btnUpload').onclick = async () => {
        const files = document.getElementById('photos').files;
        const desc = document.getElementById('description').value;
        const fallbackDate = document.getElementById('fallbackDate').value;
        const btn = document.getElementById('btnUpload');

        if (files.length === 0) return alert('Pilih minimal 1 foto laporan!');

        btn.disabled = true;
        btn.innerText = "Memproses & Mengunggah...";
        
        try {
            logStatus("Membaca tanggal foto", true);
            let dateData = await getPhotoDate(files[0]);
            
            if (!dateData) {
                if (!fallbackDate) throw new Error("Foto tidak memiliki data waktu dari kamera. Mohon isi Tanggal Alternatif.");
                let d = new Date(fallbackDate);
                dateData = {
                    year: d.getFullYear().toString(),
                    month: ('0' + (d.getMonth() + 1)).slice(-2),
                    day: ('0' + d.getDate()).slice(-2)
                };
            }

            // Fitur Unduh Otomatis File .txt
            logStatus("Membuat salinan file deskripsi...", true);
            let txtFilename = `deskripsi_${dateData.year}${dateData.month}${dateData.day}.txt`;
            let txtContent = `Tanggal: ${dateData.day}-${dateData.month}-${dateData.year}\n\nDeskripsi Kegiatan:\n${desc}`;
            let txtBlob = new Blob([txtContent], { type: 'text/plain' });
            let downloadLink = document.createElement('a');
            downloadLink.href = URL.createObjectURL(txtBlob);
            downloadLink.download = txtFilename;
            downloadLink.click();
            URL.revokeObjectURL(downloadLink.href);

            logStatus("Menyusun Laporan A4", true);
            let reportBlob = await createReportImage(files, desc, dateData);

            logStatus("Mengatur Folder Google Drive", true);
            let idUtama = await getOrCreateFolder("laporan kerja pegawai");
            let idTahun = await getOrCreateFolder(dateData.year, idUtama);
            let idBulan = await getOrCreateFolder(dateData.month, idTahun);
            let idHari = await getOrCreateFolder(dateData.day, idBulan);

            logStatus("Mengunggah Laporan ke Drive", true);
            let filename = `Laporan_${dateData.year}${dateData.month}${dateData.day}_${new Date().getTime()}.jpg`;
            await uploadToDrive(reportBlob, filename, idHari);

            logStatus("✅ Laporan Berhasil Diunggah!", false);
            alert('Sukses diunggah ke folder Drive Anda!');
            
            document.getElementById('photos').value = '';
            document.getElementById('description').value = '';
            
        } catch (err) {
            console.error(err);
            logStatus("❌ Error: " + err.message, false);
            if (err.message.includes("Sesi login")) alert(err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "Susun & Unggah Laporan";
        }
    };
</script>
</body>
</html>
